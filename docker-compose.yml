# 智课工作台容器编排
#
# 生产部署（平台反向代理挂载子路径 /zhike/）：
#   docker compose -p zhike up -d --build
#   - PostgreSQL / Valkey / sandbox 只在容器内网互访，不映射宿主端口（规避端口冲突）
#   - backend 保留 8001:8001，供平台 Nginx 以 http://127.0.0.1:8001 反代
#   - frontend 属于 dev profile：生产环境由平台 Nginx 直接托管构建产物 dist/
#     （见 deploy/DEPLOY-子路径部署.md 与 deploy/nginx-zhike.conf）
# 本地开发（含前端热更新）：
#   docker compose --profile dev -p zhike-dev up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zhike-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhike_workshop}
      POSTGRES_USER: ${POSTGRES_USER:-zhike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhike_password}
    # 本地开发映射宿主端口（本地 venv 直跑后端需要）；生产可注释避免与已有 PostgreSQL 冲突
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhike} -d ${POSTGRES_DB:-zhike_workshop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2
    container_name: zhike-valkey
    # 本地开发映射宿主端口（本地 venv 直跑后端需要）；生产可注释避免与已有 Redis/Valkey 冲突
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  backend:
    build:
      context: ./backend
    container_name: zhike-backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://zhike:zhike_password@postgres:5432/zhike_workshop
      VALKEY_URL: redis://valkey:6379/0
      SANDBOX_SERVICE_URL: http://sandbox:8003
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      sandbox:
        condition: service_healthy
    # 生产启动：先迁移数据库，再以 uvicorn 直接托管（不带 --reload，run_dev.py 仅用于本地开发）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"

  sandbox:
    build:
      context: ./backend/sandbox-service
    container_name: zhike-sandbox
    environment:
      SANDBOX_HOST: 0.0.0.0
    # 生产不映射宿主端口：仅 backend 经容器内网 sandbox:8003 访问
    # ports:
    #   - "8003:8003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  # 前端仅本地开发使用（--profile dev）；生产由平台 Nginx 托管 dist/ 构建产物
  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
    container_name: zhike-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api/v1
      VITE_WS_BASE_URL: ws://localhost:8001/ws
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0

volumes:
  postgres_data:
  valkey_data:
