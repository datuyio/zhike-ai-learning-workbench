# ============================================================
# 智课工作台 —— 子路径挂载 Nginx 配置片段（/zhike/）
# ------------------------------------------------------------
# 用法：把下面 location 块追加到平台现有 Nginx 的 server 块内
#      （该 server 监听 3001 且已配置 TLS 证书），然后：
#      nginx -t && nginx -s reload
#
# 前提：
#   1) backend 容器已映射宿主 8001（docker compose -p zhike up -d）
#   2) 前端构建产物已上传到 /srv/zhike/frontend/dist/
#      （部署脚本 scripts/build-frontend-prod.ps1 / .sh 生成，见
#       deploy/DEPLOY-子路径部署.md）
#
# 关键设计：转发时剥掉 /zhike 前缀，后端只看到 /api/v1、/ws、/health，
#           因此后端路由无需感知子路径。
# ============================================================

# ---- 前端静态资源（SPA：history 回退到 index.html）----
location /zhike/ {
    alias /srv/zhike/frontend/dist/;
    try_files $uri $uri/ /zhike/index.html;
}

# ---- 后端 REST API（剥掉 /zhike 前缀转发）----
location /zhike/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# ---- WebSocket（AI 对话 / 资源任务进度）----
location /zhike/ws {
    proxy_pass http://127.0.0.1:8001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- 健康检查 ----
location = /zhike/health {
    proxy_pass http://127.0.0.1:8001/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
