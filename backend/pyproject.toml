[project]
name = "zhike-workshop-backend"
version = "0.1.0"
description = "FastAPI backend for 智课未来"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".pytest-runtime-cache"
addopts = "--basetemp=.pytest-runtime-tmp"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "venv",
    ".pytest_cache",
    ".pytest-deps",
    ".pytest-runtime-cache",
    ".pytest-runtime-tmp",
    ".pytest-tmp",
    "storage",
]

[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]
